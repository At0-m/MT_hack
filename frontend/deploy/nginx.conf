worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 sendfile on;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml;
 server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  location = /_frontend_health { access_log off; return 200 "ok\n"; }
  # API and health paths must never become an HTML SPA success response.
  location /api/ { return 404; }
  location /health/ { return 404; }
  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=3600"; }
  location = /map-fallback.json { try_files $uri =404; add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-store"; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
