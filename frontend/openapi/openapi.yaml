        map:
          $ref: '#/components/schemas/MapConfiguration'
        limits:
          $ref: '#/components/schemas/Limits'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
    WeatherPoint:
      type: object
      additionalProperties: false
      required:
      - window
      - mode
      - temperature_c
      - precipitation_mm
      - weather_code
      - provider_run_at
      - available_at
      - availability_verified
      properties:
        window:
          $ref: '#/components/schemas/TimeWindow'
        mode:
          type: string
          enum:
          - forecast
          - climatology
          - missing
        temperature_c:
          type: number
          format: double
          nullable: true
        precipitation_mm:
          type: number
          format: double
          minimum: 0
          nullable: true
        weather_code:
          type: integer
          nullable: true
          minimum: 0
        provider_run_at:
          type: string
          format: date-time
          nullable: true
        available_at:
          type: string
          format: date-time
          nullable: true
        availability_verified:
          type: boolean
      description: For climatology weather_code and provider_run_at are null. Missing mode has null weather values. 
        available_at is information availability, not download time. Precipitation must be aligned to the interval; 
        provider backward-looking timestamps are normalized by the adapter.
    WeatherResponse:
      type: object
      additionalProperties: false
      required:
      - weather_snapshot_id
      - forecast_snapshot_id
      - route_id
      - location_id
      - provider
      - retrieved_at
      - source_id
      - window
      - points
      - notices
      properties:
        weather_snapshot_id:
