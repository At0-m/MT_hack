        zoom:
          type: number
          format: double
          minimum: 0
          maximum: 24
      description: External basemap availability is not guaranteed. Local fallback shows route geography without 
        basemap. Attribution must stay visible.
    Capabilities:
      type: object
      additionalProperties: false
      required:
      - forecast_scopes
      - scenario_fleet
      - scenario_factors
      - physical_weather_overrides
      - csv_export
      - live_ingestion
      - summary
      - custom_period
      - session_auth
      - stop_forecasts
      - segment_forecasts
      - decorative_approach_effect
      properties:
        forecast_scopes:
          type: array
          items:
            type: string
            enum:
            - route
            - route_stop
          minItems: 1
          maxItems: 2
          uniqueItems: true
        scenario_fleet:
          type: boolean
        scenario_factors:
          type: array
          items:
            type: string
            enum:
            - weather
            - event
            - season
          minItems: 3
          maxItems: 3
          uniqueItems: true
        physical_weather_overrides:
          type: boolean
          enum:
          - false
        csv_export:
          type: boolean
        live_ingestion:
          type: boolean
          enum:
          - false
        summary:
          type: boolean
          enum:
          - true
        custom_period:
          type: boolean
          enum:
          - true
        session_auth:
          type: boolean
          enum:
          - true
        stop_forecasts:
          type: boolean
          description: True when the active snapshot provides real stop-level forecast artifacts/coverage.
        segment_forecasts:
          type: boolean
          enum:
          - false
          description: v1.2 does not define analytical segment forecasts; the approach ramp is decorative frontend 
            rendering.
        decorative_approach_effect:
          type: boolean
          enum:
          - true
      description: Capabilities describe actual active-snapshot support. route_stop means first-class stop predictions, 
        not repeated route values. The approach visual is decorative and never an analytical segment forecast.
    Bootstrap:
      type: object
      additionalProperties: false
      required:
