  /api/v1/summaries/query:
    post:
      operationId: querySummary
      tags:
      - Summary
      summary: Build deterministic text summary for an exact calculation and period
      description: Synchronous bounded summary. No LLM is required. Backend derives wording from already computed 
        metrics/indicators and must not claim causal influence. Frontend loading state is the in-flight HTTP state; 
        ready/unavailable are response states. expected_calculation_id mismatch ->409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SummaryQuery'
            examples:
              synthetic:
                $ref: '#/components/examples/SummaryRequest'
      responses:
        '200':
          description: Summary ready or explicitly unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
              examples:
                synthetic:
                  $ref: '#/components/examples/SummaryResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
