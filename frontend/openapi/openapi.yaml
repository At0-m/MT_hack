          application/json:
            schema:
              $ref: '#/components/schemas/ForecastQuery'
            examples:
              synthetic:
                $ref: '#/components/examples/ForecastRequest'
  /api/v1/scenarios/evaluate:
    post:
      operationId: evaluateScenario
      tags:
      - Scenario
      summary: Evaluate formula-based fleet/manual-demand scenario for route and optional stop forecasts
      description: Pure read. Reuses Model A boardings. Changing fleet or manual multipliers never retrains/reruns Model
        A when pinned baseline is cached. Formulas apply hourly within effective_window, then aggregate. No real 
        dispatch operation. Negative resulting fleet or unknown baseline for a delta ->422.
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Request correlation ID. Echo a valid incoming ID, or create one.
              schema:
                type: string
            Cache-Control:
              description: Per-operation caching policy.
              schema:
                type: string
          content:
