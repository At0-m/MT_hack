      - focus
      properties:
        calculation:
          $ref: '#/components/schemas/CalculationDescriptor'
        expected_calculation_id:
          $ref: '#/components/schemas/CalculationId'
        focus:
          $ref: '#/components/schemas/SummaryFocus'
      description: Replays the exact calculation descriptor and verifies expected_calculation_id. Summary period is 
        exactly calculation.selection.window; no implicit expansion or current-state lookup.
    SummaryFact:
      type: object
      additionalProperties: false
      required:
      - key
      - text
