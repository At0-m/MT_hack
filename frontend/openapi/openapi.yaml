      operationId: exportCalculation
      tags:
      - Export
      summary: Export the exact confirmed calculation as CSV
      description: Synchronous CSV, not a task. Complete validation and bounded buffering before 200. UTF-8 BOM, 
        semicolon delimiter, decimal point, CRLF, RFC4180 quoting, null as empty cell. Exact columns in docs/CSV.md. 
        Hash is returned in X-Calculation-ID; user export is NOT competition submission.
      responses:
        '200':
          description: Complete CSV attachment. No polling or follow-up GET.
          headers:
            X-Request-ID:
              description: Request correlation ID. Echo a valid incoming ID, or create one.
              schema:
                type: string
            Cache-Control:
              description: Per-operation caching policy.
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="tramflow-<safe-id>.csv"
            X-Calculation-ID:
              schema:
                $ref: '#/components/schemas/CalculationId'
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
        '415':
          $ref: '#/components/responses/Error415'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
            examples:
              synthetic:
                $ref: '#/components/examples/ExportRequest'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: tramflow_session
      description: Same-origin opaque session identifier. Set only by POST /api/v1/auth/login as HttpOnly; Secure in 
        production; SameSite=Strict. Frontend never stores credentials or session tokens in localStorage.
  responses:
    Error400:
      description: Invalid JSON, query syntax or schema.
      headers:
        X-Request-ID:
          description: Request correlation ID. Echo a valid incoming ID, or create one.
          schema:
            type: string
        Cache-Control:
          description: Per-operation caching policy.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error401:
      description: Authentication required or session expired.
      headers:
        X-Request-ID:
          description: Request correlation ID. Echo a valid incoming ID, or create one.
          schema:
            type: string
        Cache-Control:
          description: Per-operation caching policy.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error404:
      description: Unknown identifier.
      headers:
        X-Request-ID:
          description: Request correlation ID. Echo a valid incoming ID, or create one.
          schema:
            type: string
        Cache-Control:
          description: Per-operation caching policy.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error409:
      description: Calculation hash mismatch.
      headers:
        X-Request-ID:
          description: Request correlation ID. Echo a valid incoming ID, or create one.
          schema:
            type: string
        Cache-Control:
          description: Per-operation caching policy.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error410:
      description: Known snapshot was retired and removed.
      headers:
        X-Request-ID:
          description: Request correlation ID. Echo a valid incoming ID, or create one.
          schema:
            type: string
        Cache-Control:
          description: Per-operation caching policy.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error413:
      description: Body/export exceeds limits.
      headers:
        X-Request-ID:
          description: Request correlation ID. Echo a valid incoming ID, or create one.
          schema:
            type: string
        Cache-Control:
          description: Per-operation caching policy.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error422:
      description: Valid structure but unsupported semantic combination.
      headers:
        X-Request-ID:
          description: Request correlation ID. Echo a valid incoming ID, or create one.
          schema:
            type: string
        Cache-Control:
          description: Per-operation caching policy.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error429:
      description: Admission/rate limit exceeded; Retry-After seconds.
      headers:
        X-Request-ID:
          description: Request correlation ID. Echo a valid incoming ID, or create one.
          schema:
            type: string
        Cache-Control:
          description: Per-operation caching policy.
          schema:
            type: string
        Retry-After:
          schema:
            type: string
          description: Positive integer delay in seconds.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error503:
      description: Not ready or bounded compute queue exhausted.
      headers:
        X-Request-ID:
          description: Request correlation ID. Echo a valid incoming ID, or create one.
          schema:
            type: string
        Cache-Control:
          description: Per-operation caching policy.
          schema:
            type: string
        Retry-After:
          schema:
            type: string
          description: Positive integer delay in seconds.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error504:
      description: Calculation timeout; no partial result.
      headers:
        X-Request-ID:
          description: Request correlation ID. Echo a valid incoming ID, or create one.
          schema:
            type: string
        Cache-Control:
          description: Per-operation caching policy.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error415:
      description: Unsupported Content-Type; application/json required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Id:
      type: string
      description: Opaque stable identifier; route numbers are strings, not integers.
      minLength: 1
      maxLength: 96
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,95}$
    CalculationId:
      type: string
      description: SHA-256 of the canonical computation descriptor; NOT a persisted resource ID. See 
        docs/CALCULATIONS.md.
      pattern: ^calc_[0-9a-f]{64}$
    TimeWindow:
      type: object
      additionalProperties: false
      required:
      - from
      - to
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      description: Half-open [from,to), RFC3339 with explicit timezone. from < to is runtime validation. Day-resolution 
        selections must use Europe/Moscow local-midnight bounds; day view uses one local day and hour resolution.
    ViewMode:
      type: string
      enum:
      - day
      - week
      - month
      - custom
    Resolution:
      type: string
      enum:
      - hour
      - day
    ForecastSelection:
      oneOf:
      - $ref: '#/components/schemas/DayForecastSelection'
      - $ref: '#/components/schemas/WeekForecastSelection'
      - $ref: '#/components/schemas/MonthForecastSelection'
      - $ref: '#/components/schemas/CustomForecastSelection'
      discriminator:
        propertyName: view_mode
        mapping:
          day: '#/components/schemas/DayForecastSelection'
          week: '#/components/schemas/WeekForecastSelection'
          month: '#/components/schemas/MonthForecastSelection'
          custom: '#/components/schemas/CustomForecastSelection'
      description: View-mode-specific selection. custom never supports hourly resolution; use day view + local wheel for
        hourly exploration.
    ForecastQuery:
      type: object
      additionalProperties: false
      required:
      - selection
      properties:
        selection:
          $ref: '#/components/schemas/ForecastSelection'
    Factors:
      type: object
      additionalProperties: false
      required: []
      properties:
        weather:
          type: number
          format: double
          minimum: 0.5
          maximum: 2
          multipleOf: 0.001
          default: 1
        event:
          type: number
          format: double
          minimum: 0.5
          maximum: 2
          multipleOf: 0.001
          default: 1
        season:
          type: number
          format: double
          minimum: 0.5
          maximum: 2
          multipleOf: 0.001
          default: 1
      description: Additional manual multipliers on model boardings, NOT physical weather inputs and NOT causal effects.
        Missing values default to 1. Precision <=3 decimals. Product must be between 0.25 and 4 inclusive (runtime).
    AbsoluteFleet:
      type: object
      additionalProperties: false
      required:
      - kind
      - vehicle_count
      properties:
        kind:
          type: string
          enum:
          - absolute
        vehicle_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 200
      description: Assumed effective fleet in every affected hourly bucket, not departures. 0 is a valid no-supply 
        scenario.
    DeltaFleet:
      type: object
      additionalProperties: false
      required:
      - kind
      - vehicle_count_delta
      properties:
        kind:
          type: string
          enum:
          - delta
        vehicle_count_delta:
          type: integer
          format: int32
          minimum: -200
          maximum: 200
      description: Add to each hourly baseline fleet. Baseline must be known in every affected cell; result must be 
        0..200. Values are not clamped.
    FleetOverride:
      oneOf:
      - $ref: '#/components/schemas/AbsoluteFleet'
      - $ref: '#/components/schemas/DeltaFleet'
      discriminator:
        propertyName: kind
        mapping:
          absolute: '#/components/schemas/AbsoluteFleet'
          delta: '#/components/schemas/DeltaFleet'
    ScenarioOverrides:
      type: object
      additionalProperties: false
      required:
      - effective_window
      properties:
        effective_window:
          $ref: '#/components/schemas/TimeWindow'
        fleet:
          $ref: '#/components/schemas/FleetOverride'
        factors:
          $ref: '#/components/schemas/Factors'
      description: Effective window must be contained in selection.window. Applies to all selection.route_ids, before 
        temporal aggregation. Outside this window use baseline. Scenario is relative to original snapshot, never to a 
        previous scenario.
      anyOf:
      - required:
        - fleet
      - required:
        - factors
    ScenarioQuery:
      type: object
      additionalProperties: false
      required:
      - selection
      - overrides
      properties:
        selection:
          $ref: '#/components/schemas/ForecastSelection'
        overrides:
          $ref: '#/components/schemas/ScenarioOverrides'
    ForecastCalculation:
      type: object
      additionalProperties: false
      required:
      - kind
      - selection
      properties:
        kind:
          type: string
          enum:
          - forecast
        selection:
          $ref: '#/components/schemas/ForecastSelection'
    ScenarioCalculation:
      type: object
      additionalProperties: false
      required:
      - kind
      - selection
      - overrides
      properties:
        kind:
          type: string
          enum:
          - scenario
        selection:
          $ref: '#/components/schemas/ForecastSelection'
        overrides:
          $ref: '#/components/schemas/ScenarioOverrides'
    CalculationDescriptor:
      oneOf:
      - $ref: '#/components/schemas/ForecastCalculation'
      - $ref: '#/components/schemas/ScenarioCalculation'
      discriminator:
        propertyName: kind
        mapping:
          forecast: '#/components/schemas/ForecastCalculation'
          scenario: '#/components/schemas/ScenarioCalculation'
    UndefinedReason:
      type: string
      enum:
      - SUPPLY_UNKNOWN
      - NO_SUPPLY
      - REFERENCE_MISSING
      - REFERENCE_ZERO
      - BASELINE_ZERO
      - NO_TYPICAL_PROFILE
      - NO_MEASUREMENT
      - INCOMPLETE_COVERAGE
    AvailableNumber:
      type: object
      additionalProperties: false
      required:
      - status
      - value
      properties:
        status:
          type: string
          enum:
          - available
        value:
          type: number
          format: double
          minimum: 0
    AvailableInteger:
      type: object
      additionalProperties: false
      required:
      - status
      - value
      properties:
        status:
          type: string
          enum:
          - available
        value:
          type: integer
          format: int32
          minimum: 0
    UnavailableNumber:
      type: object
      additionalProperties: false
      required:
      - status
      - value
      - reason
      properties:
        status:
          type: string
          enum:
          - unavailable
        value:
          type: number
          nullable: true
          enum:
          - null
        reason:
          $ref: '#/components/schemas/UndefinedReason'
    NumericReading:
      oneOf:
      - $ref: '#/components/schemas/AvailableNumber'
      - $ref: '#/components/schemas/UnavailableNumber'
      discriminator:
        propertyName: status
        mapping:
          available: '#/components/schemas/AvailableNumber'
          unavailable: '#/components/schemas/UnavailableNumber'
    IntegerReading:
      oneOf:
      - $ref: '#/components/schemas/AvailableInteger'
      - $ref: '#/components/schemas/UnavailableNumber'
      discriminator:
        propertyName: status
        mapping:
          available: '#/components/schemas/AvailableInteger'
          unavailable: '#/components/schemas/UnavailableNumber'
    LoadLevel:
      type: string
      enum:
      - normal
      - elevated
      - high
      - very_high
      - unavailable
    MetricSet:
      type: object
      additionalProperties: false
      required:
      - boardings
      - vehicle_hours
      - mean_vehicle_count
      - boardings_per_vehicle_hour
      - reference_boardings
      - load_index
      - load_level
      - required_vehicle_count
      - fleet_source
      - fleet_is_proxy
      properties:
        boardings:
          type: number
          format: double
          minimum: 0
          description: Expected count, may be fractional. Sum hourly predictions; do not round before aggregation.
        vehicle_hours:
          $ref: '#/components/schemas/NumericReading'
        mean_vehicle_count:
          $ref: '#/components/schemas/NumericReading'
        boardings_per_vehicle_hour:
          $ref: '#/components/schemas/NumericReading'
        reference_boardings:
          $ref: '#/components/schemas/NumericReading'
        load_index:
          $ref: '#/components/schemas/NumericReading'
        load_level:
          $ref: '#/components/schemas/LoadLevel'
        required_vehicle_count:
          $ref: '#/components/schemas/IntegerReading'
        fleet_source:
          type: string
          enum:
          - observed_vehicle_profile
          - manual_plan
          - scenario_absolute
          - scenario_delta
          - mixed
          - unavailable
        fleet_is_proxy:
          type: boolean
      description: All formulas in docs/CALCULATIONS.md. Load index is relative to an empirical historical reference, 
        NOT cabin occupancy. Ratios are recomputed from aggregate numerators/denominators. required_vehicle_count is max
        hourly hypothetical requirement at snapshot target_index, NOT a dispatch recommendation.
    WeatherSummary:
      type: object
      additionalProperties: false
      required:
      - mode
      - temperature_mean_c
      - precipitation_sum_mm
      - forecast_hours
      - climatology_hours
      - missing_hours
      properties:
        mode:
          type: string
          enum:
          - forecast
          - climatology
          - mixed
          - missing
        temperature_mean_c:
          type: number
          format: double
          nullable: true
        precipitation_sum_mm:
          type: number
          format: double
          minimum: 0
          nullable: true
        forecast_hours:
          type: integer
          format: int32
          minimum: 0
          maximum: 744
        climatology_hours:
          type: integer
          format: int32
          minimum: 0
          maximum: 744
        missing_hours:
          type: integer
          format: int32
          minimum: 0
          maximum: 744
      description: Derived from the pinned weather snapshot. If any hour is missing, affected aggregate numeric fields 
        are null, not a partial sum.
    MetricDelta:
      type: object
      additionalProperties: false
      required:
      - boardings
      - load_index
      - vehicle_hours
      properties:
        boardings:
          type: number
          format: double
        load_index:
          type: number
          format: double
          nullable: true
        vehicle_hours:
          type: number
          format: double
          nullable: true
      description: evaluated - baseline. An undefined operand produces null. Load-index delta is an absolute ratio 
        difference, not a relative percent.
    RouteReading:
      type: object
      additionalProperties: false
      required:
      - route_id
      - typical_boardings
      - relative_to_typical
      - baseline
      - evaluated
      - delta
      - weather
      - stop_readings
      - indicators
      properties:
        route_id:
          $ref: '#/components/schemas/Id'
        typical_boardings:
          $ref: '#/components/schemas/NumericReading'
        relative_to_typical:
          type: number
          format: double
          minimum: -1
          nullable: true
        baseline:
          $ref: '#/components/schemas/MetricSet'
        evaluated:
          $ref: '#/components/schemas/MetricSet'
        delta:
          $ref: '#/components/schemas/MetricDelta'
        weather:
          $ref: '#/components/schemas/WeatherSummary'
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/UiIndicator'
          minItems: 0
          maxItems: 6
        stop_readings:
          type: array
          items:
            $ref: '#/components/schemas/StopReading'
          minItems: 0
          maxItems: 500
          description: Populated only for spatial_detail=route_stop; empty for route-only calculations.
      description: 'No scenario: evaluated equals baseline. relative_to_typical uses evaluated.boardings; denominator 0 or
        absent -> null. stop_readings are real stop-level forecasts when requested and supported; visual approach effects
        are frontend-only.'
    Frame:
      type: object
      additionalProperties: false
      required:
      - window
      - routes
      properties:
        window:
          $ref: '#/components/schemas/TimeWindow'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteReading'
          minItems: 1
          maxItems: 10
      description: Frames are contiguous, non-overlapping and sorted; routes sorted by route_id. Day view frames are 
        hourly; week/month/custom frames are daily. Stop readings inherit the enclosing frame window.
    VisualizationPolicy:
      type: object
      additionalProperties: false
      required:
      - metric
      - scale_min
      - scale_max
      - overflow
      - thresholds
      - reference_version
      - label
      - stop_columns
      properties:
        metric:
          type: string
          enum:
          - load_index
        scale_min:
          type: number
          format: double
          minimum: 0
        scale_max:
          type: number
          format: double
          minimum: 0
        overflow:
          type: string
          enum:
          - show_overflow
        thresholds:
          type: array
          items:
            type: number
            minimum: 0
          minItems: 3
          maxItems: 3
        reference_version:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        stop_columns:
          $ref: '#/components/schemas/StopVisualizationPolicy'
      description: Stable visualization policy across frames/scenarios. Numeric index is never clamped. Thresholds are 
        product policy, not capacity standards. stop_columns describes frontend rendering only and does not create extra
        analytical values.
    Notice:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - severity
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
        message:
          type: string
        severity:
          type: string
          enum:
          - info
          - warning
    Provenance:
      type: object
      additionalProperties: false
      required:
      - forecast_snapshot_id
      - forecast_origin_at
      - observations_complete_through
      - model_version
      - feature_schema_version
      - history_version
      - weather_snapshot_id
      - supply_profile_version
      - reference_version
      - scenario_policy_version
      - network_version
      - runtime_mode
      properties:
        forecast_snapshot_id:
          $ref: '#/components/schemas/Id'
        forecast_origin_at:
          type: string
          format: date-time
        observations_complete_through:
          type: string
          format: date-time
        model_version:
          $ref: '#/components/schemas/Id'
        feature_schema_version:
          $ref: '#/components/schemas/Id'
        history_version:
          $ref: '#/components/schemas/Id'
        weather_snapshot_id:
          $ref: '#/components/schemas/Id'
        supply_profile_version:
          $ref: '#/components/schemas/Id'
        reference_version:
          $ref: '#/components/schemas/Id'
        scenario_policy_version:
          $ref: '#/components/schemas/Id'
        network_version:
          $ref: '#/components/schemas/Id'
        runtime_mode:
          type: string
          enum:
          - replay
          - operational
          - synthetic_mock
        stop_model_version:
          $ref: '#/components/schemas/Id'
          description: Optional. Required when any coverage exposes route_stop forecasts.
        stop_feature_schema_version:
          $ref: '#/components/schemas/Id'
          description: Optional. Required when stop_model_version is present.
    CalculationResponse:
      type: object
      additionalProperties: false
      required:
      - calculation_id
      - descriptor
      - provenance
      - target_load_index
      - frames
      - totals
      - visualization
      - notices
      properties:
        calculation_id:
          $ref: '#/components/schemas/CalculationId'
        descriptor:
          $ref: '#/components/schemas/CalculationDescriptor'
        provenance:
          $ref: '#/components/schemas/Provenance'
        target_load_index:
          type: number
          format: double
          minimum: 0.1
          maximum: 3
        frames:
          type: array
          items:
            $ref: '#/components/schemas/Frame'
          minItems: 1
          maxItems: 744
        totals:
          type: array
          items:
            $ref: '#/components/schemas/RouteReading'
          minItems: 1
          maxItems: 10
        visualization:
          $ref: '#/components/schemas/VisualizationPolicy'
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
          minItems: 0
          maxItems: 30
      description: Stateless read result. totals cover the exact request window per route, with correctly recomputed 
        ratios. No cross-route occupancy sum. All numeric outputs finite. Context stays pinned until explicit refresh.
    RouteCoverage:
      type: object
      additionalProperties: false
      required:
      - route_id
      - window
      - resolutions
      - max_lead_hours
      - status
      - prediction_scopes
      - stop_forecast_status
      properties:
        route_id:
          $ref: '#/components/schemas/Id'
        window:
          $ref: '#/components/schemas/TimeWindow'
        resolutions:
          type: array
          items:
            $ref: '#/components/schemas/Resolution'
          minItems: 1
          maxItems: 2
          uniqueItems: true
        max_lead_hours:
          type: integer
          format: int32
          minimum: 1
          maximum: 744
        status:
          type: string
          enum:
          - validated
          - experimental
        prediction_scopes:
          type: array
          items:
            type: string
            enum:
            - route
            - route_stop
          minItems: 1
          maxItems: 2
          uniqueItems: true
        stop_forecast_status:
          type: string
          enum:
          - unavailable
          - experimental
          - validated
          description: route_stop may appear in prediction_scopes only when status is experimental or validated.
    Snapshot:
      type: object
      additionalProperties: false
      required:
      - provenance
      - created_at
      - coverage
      - view_modes
      - reference_quantile
      - target_load_index
      - retention_hours_after_deactivation
      - limitations
      properties:
        provenance:
          $ref: '#/components/schemas/Provenance'
        created_at:
          type: string
          format: date-time
        coverage:
          type: array
          items:
            $ref: '#/components/schemas/RouteCoverage'
          minItems: 1
          maxItems: 10
        view_modes:
          type: array
          items:
            $ref: '#/components/schemas/ViewMode'
          minItems: 1
          maxItems: 4
          uniqueItems: true
        reference_quantile:
          type: number
          format: double
          minimum: 0
          maximum: 1
        target_load_index:
          type: number
          format: double
          minimum: 0.1
          maximum: 3
        retention_hours_after_deactivation:
          type: integer
          format: int32
          minimum: 24
        limitations:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
          minItems: 0
      description: Immutable data/model/weather/supply tuple. An update creates a NEW ID; old requests never silently 
        switch to current. Coverage is a server declaration, not inferred from dataset filenames.
    Position:
      type: object
      additionalProperties: false
      required:
      - longitude
      - latitude
      properties:
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
    RouteSummary:
