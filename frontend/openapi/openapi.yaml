            $ref: '#/components/schemas/ValidationRecord'
          minItems: 0
        source_effects:
          type: array
          items:
            $ref: '#/components/schemas/SourceEffect'
          minItems: 0
        limitations:
          type: array
          items:
            type: string
          minItems: 0
