          type: string
          minLength: 1
        version:
          $ref: '#/components/schemas/Id'
        license_note:
          type: string
        retrieved_at:
          type: string
          format: date-time
        used_for_model:
          type: boolean
        limitations:
          type: array
          items:
            type: string
