      - user
      - expires_at
      properties:
        authenticated:
          type: boolean
          enum:
          - true
        user:
          $ref: '#/components/schemas/UserInfo'
        expires_at:
          type: string
          format: date-time
      description: Browser refresh keeps the login because the opaque session is carried by the HttpOnly cookie. The 
        cookie is not exposed to JavaScript.
    IndicatorTone:
      type: string
      enum:
      - neutral
      - info
      - positive
      - warning
      - critical
    IndicatorIcon:
      type: string
      enum:
      - none
      - weather
      - fleet
      - trend
      - peak
      - event
      - calendar
    UiIndicator:
      type: object
      additionalProperties: false
      required:
      - key
      - tone
      - icon
      - variant
      - title
      - text
      properties:
        key:
          type: string
          enum:
          - weather
          - fleet
          - trend
          - peak
          - event
          - calendar
        tone:
          $ref: '#/components/schemas/IndicatorTone'
        icon:
          $ref: '#/components/schemas/IndicatorIcon'
        title:
          type: string
          maxLength: 120
        text:
          type: string
          maxLength: 300
        variant:
          $ref: '#/components/schemas/IndicatorVariant'
      description: Backend-owned semantic indicator. Frontend maps (key, variant, tone) to agreed design tokens and 
        never parses title/text to choose an icon or infer causality. Backend validates compatible key/variant pairs. 
        Neutral state uses variant=none and icon=none.
    SummaryFocus:
      oneOf:
      - $ref: '#/components/schemas/OverallSummaryFocus'
      - $ref: '#/components/schemas/RouteSummaryFocus'
      - $ref: '#/components/schemas/RouteStopSummaryFocus'
      discriminator:
        propertyName: kind
        mapping:
          overall: '#/components/schemas/OverallSummaryFocus'
          route: '#/components/schemas/RouteSummaryFocus'
          route_stop: '#/components/schemas/RouteStopSummaryFocus'
    SummaryQuery:
      type: object
      additionalProperties: false
      required:
