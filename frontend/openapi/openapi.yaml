        max_window_hours:
          type: integer
          format: int32
          minimum: 1
          maximum: 8784
        max_hourly_cells:
          type: integer
          format: int32
          minimum: 1
          maximum: 7440
        max_body_bytes:
          type: integer
          format: int32
          minimum: 1
        max_export_rows:
          type: integer
          format: int32
          minimum: 1
        max_export_bytes:
          type: integer
          format: int32
          minimum: 1
        forecast_timeout_ms:
          type: integer
          format: int32
          minimum: 1
        max_concurrent_inference:
