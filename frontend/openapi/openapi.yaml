          type: string
          enum:
          - month
        resolution:
          type: string
          enum:
          - day
      description: Exactly one Europe/Moscow local calendar month; backend returns one frame per calendar day.
    CustomForecastSelection:
      type: object
      additionalProperties: false
      required:
      - forecast_snapshot_id
      - route_ids
      - view_mode
      - window
      - resolution
      - spatial_detail
      properties:
        forecast_snapshot_id:
          $ref: '#/components/schemas/Id'
        route_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          minItems: 1
          maxItems: 10
          uniqueItems: true
        window:
          $ref: '#/components/schemas/TimeWindow'
        spatial_detail:
          $ref: '#/components/schemas/SpatialDetail'
        view_mode:
          type: string
          enum:
          - custom
        resolution:
          type: string
          enum:
          - day
      description: Arbitrary local-date range at day resolution only. Bounds are Europe/Moscow local midnights, may 
        cross months/years/leap day, and duration must not exceed limits.max_custom_days.
