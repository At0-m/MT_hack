openapi: 3.0.3
info:
  title: TramFlow implementation contract
  version: 1.2.0
  description: 'Team-agreed implementation contract. Runtime source of truth is PostgreSQL + PostGIS; immutable ML artifacts
    remain on filesystem/object storage. Route/hour boardings remain the official competition target, while route-stop forecasts
    are a first-class optional runtime scope backed by separately versioned ML artifacts when available. Scenario Engine is
    deterministic. UI views: day/week/month/custom; custom is day-resolution only. Map columns are rendered from real stop
    metrics; approach columns/ramps are decorative frontend effects and do not represent extra measurements. Weather is pinned
    from Open-Meteo snapshots. Authentication uses same-origin HttpOnly session cookie. All bundled examples are SYNTHETIC.'
servers:
- url: http://localhost:8080
  description: Local mock/development; production uses same-origin HTTPS.
- url: /
  description: Same-origin deployed service.
security:
- SessionCookie: []
tags:
- name: Summary
- name: Auth
- name: Operations
- name: Catalog
- name: Map
- name: Forecast
- name: Scenario
- name: Weather
- name: Quality
- name: Export
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags:
      - Operations
      summary: HTTP process liveness
      description: HTTP process liveness
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Request correlation ID. Echo a valid incoming ID, or create one.
              schema:
                type: string
            Cache-Control:
              description: Per-operation caching policy.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /health/ready:
    get:
      operationId: getReadiness
      tags:
      - Operations
      summary: PostgreSQL, active snapshot, ONNX adapter and initial weather/fallback readiness
      description: 200 when PostgreSQL is reachable, an active fully validated snapshot is readable, referenced 
        immutable ML artifact is loadable, and model session is ready. Does not require external Open-Meteo or basemap 
        availability per request.
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Request correlation ID. Echo a valid incoming ID, or create one.
              schema:
                type: string
            Cache-Control:
              description: Per-operation caching policy.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Create browser session from login form
      description: Validates username/password against the configured user store, creates a server-side session in 
        PostgreSQL and sets tramflow_session. Do not return password, password hash or reusable bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated. Session cookie is set.
          headers:
            Set-Cookie:
              description: tramflow_session=<opaque>; Path=/; HttpOnly; SameSite=Strict; Secure in production
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '415':
          $ref: '#/components/responses/Error415'
  /api/v1/auth/session:
    get:
      operationId: getAuthSession
      tags:
      - Auth
      summary: Read current browser session
      description: Called on application startup/refresh. 200 means the existing HttpOnly cookie maps to an active 
        server-side session; 401 means show the login form.
      responses:
        '200':
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Error401'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: Revoke current browser session
      description: Deletes/revokes the server-side session and expires the cookie. Idempotent for an authenticated 
        request.
      responses:
        '204':
          description: Session revoked.
          headers:
            Set-Cookie:
              description: Expire tramflow_session cookie immediately.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error401'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/bootstrap:
    get:
      operationId: getBootstrap
      tags:
      - Catalog
      summary: Get pinned snapshot, defaults and UI capabilities
      description: Cache-Control:no-store. Active snapshot and limits come from authoritative PostgreSQL registry. Use 
        returned default_selection; never infer dates or route IDs from examples.
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Request correlation ID. Echo a valid incoming ID, or create one.
              schema:
                type: string
            Cache-Control:
              description: Per-operation caching policy.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '410':
          $ref: '#/components/responses/Error410'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
  /api/v1/snapshots/{forecast_snapshot_id}:
    get:
      operationId: getSnapshot
      tags:
      - Catalog
      summary: Read immutable forecast snapshot metadata
      description: Cache-Control:private,no-cache. Keep previous snapshots at least the advertised retention after 
        deactivation.
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Request correlation ID. Echo a valid incoming ID, or create one.
              schema:
                type: string
            Cache-Control:
              description: Per-operation caching policy.
              schema:
                type: string
            ETag:
              schema:
                type: string
              description: Version/content validator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '410':
          $ref: '#/components/responses/Error410'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
        '304':
          description: Not modified. Body omitted. Authentication still checked.
          headers:
            X-Request-ID:
              description: Request correlation ID. Echo a valid incoming ID, or create one.
              schema:
                type: string
            Cache-Control:
              description: Per-operation caching policy.
              schema:
                type: string
            ETag:
              schema:
                type: string
              description: Version/content validator.
      parameters:
      - name: forecast_snapshot_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
