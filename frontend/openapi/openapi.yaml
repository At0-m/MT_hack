  /api/v1/forecasts/query:
    post:
      operationId: queryForecast
      tags:
      - Forecast
      summary: Batch forecast route boardings and optional route-stop boardings
      description: Runs the pinned forecast model(s), formula metrics and aggregation for the exact selection. 
        spatial_detail=route_stop returns first-class stop_readings keyed by route_pattern_id + route_stop_id. The API 
        never fabricates multiple approach samples for visual effects. Day responses return hourly frames; 
        week/month/custom return daily frames.
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Request correlation ID. Echo a valid incoming ID, or create one.
              schema:
                type: string
            Cache-Control:
              description: Per-operation caching policy.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'
              examples:
                synthetic:
                  $ref: '#/components/examples/ForecastResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          $ref: '#/components/responses/Error504'
        '415':
          $ref: '#/components/responses/Error415'
