      type: string
      enum:
      - ml_stop_model
      - synthetic_mock
      description: ml_stop_model means a real separately versioned stop-level ML prediction; synthetic_mock is 
        development only.
    StopReading:
      type: object
      additionalProperties: false
      required:
      - route_id
      - route_pattern_id
      - route_stop_id
      - stop_id
      - sequence
      - prediction_method
      - typical_boardings
      - relative_to_typical
      - baseline
      - evaluated
      - delta
      properties:
        route_id:
          $ref: '#/components/schemas/Id'
        route_pattern_id:
          $ref: '#/components/schemas/Id'
        route_stop_id:
          $ref: '#/components/schemas/Id'
        stop_id:
          $ref: '#/components/schemas/Id'
        sequence:
          type: integer
          format: int32
          minimum: 0
        prediction_method:
          $ref: '#/components/schemas/StopPredictionMethod'
        typical_boardings:
          $ref: '#/components/schemas/NumericReading'
        relative_to_typical:
          type: number
          format: double
          minimum: -1
          nullable: true
        baseline:
          $ref: '#/components/schemas/MetricSet'
        evaluated:
          $ref: '#/components/schemas/MetricSet'
        delta:
          $ref: '#/components/schemas/MetricDelta'
      description: First-class stop-level forecast for the enclosing frame. It is not a copy of the route value. 
        Geometry is joined by route_stop_id using RouteGeometry. Stop load_index is a normalized boarding-intensity 
        metric, not cabin occupancy.
    StopVisualizationPolicy:
      type: object
      additionalProperties: false
      required:
      - data_anchor
      - value_metric
      - approach_effect
      - approach_length_m
      - profile
      properties:
        data_anchor:
          type: string
          enum:
          - stop_position
        value_metric:
          type: string
          enum:
          - load_index
        approach_effect:
          type: string
          enum:
          - decorative
        approach_length_m:
          type: number
          format: double
          minimum: 0
          maximum: 100
        profile:
          type: string
          enum:
          - ramp_to_stop
      description: Rendering hint only. Frontend may draw a chain/ramp before the stop using the single stop value. It 
        MUST NOT interpret decorative samples as separate segment measurements or forecasts.
    IndicatorVariant:
      type: string
      enum:
      - none
      - clear
      - cloudy
      - rain
      - snow
      - heat
      - cold
      - other
      - deficit
      - balanced
      - surplus
      - up
      - down
      - flat
      - peak
      - off_peak
      - weekday
      - weekend
      - holiday
      - active
      - inactive
      - unknown
      description: Exact semantic variant used by frontend to choose the icon/illustration. Text must never be parsed to
        infer this state.
