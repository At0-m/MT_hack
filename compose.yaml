name: ${COMPOSE_PROJECT_NAME:-tramflow}
x-app: &app
  image: ${APP_IMAGE:-tramflow:local}
  build:
    context: ./backend
    target: ${RUNTIME_TARGET:-demo}
  platform: linux/amd64
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=64m,mode=1777
  init: true
  stop_grace_period: 45s
  pids_limit: 256
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: tramflow_publisher
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run make init}
      POSTGRES_DB: tramflow
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Run make init}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:?Run make init}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/db-init.sh:/docker-entrypoint-initdb.d/10-api-role.sh:ro
      - ./deploy/postgres/20-monitoring.sh:/docker-entrypoint-initdb.d/20-monitoring.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h db -p 5432 -U tramflow_publisher -d tramflow"
        ]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    cpus: ${DB_CPUS:-2}
    mem_limit: ${DB_MEMORY:-1g}
    memswap_limit: ${DB_MEMORY:-1g}
    shm_size: 128m
    restart: unless-stopped
  seed:
    <<: *app
    entrypoint: [/app/demo-init]
    healthcheck: {disable: true}
    environment:
      DATABASE_URL: postgres://tramflow_publisher:${DB_PASSWORD}@db:5432/tramflow?sslmode=disable
      API_USER: ${API_USER:-devops}
      API_PASSWORD: ${API_PASSWORD:?Run make init}
    depends_on:
      db: {condition: service_healthy}
    cpus: 2
    mem_limit: 1g
    memswap_limit: 1g
    restart: "no"
  api:
    <<: *app
    environment:
      DATABASE_URL: postgres://tramflow_api:${API_DB_PASSWORD}@db:5432/tramflow?sslmode=disable
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      ADMIN_ADDR: 0.0.0.0:9090
      ENABLE_PPROF: ${ENABLE_PPROF:-false}
      FORECAST_CACHE_BYTES: ${FORECAST_CACHE_BYTES:-67108864}
      TRUSTED_PROXY_CIDRS: ""
    depends_on:
      seed: {condition: service_completed_successfully}
    cpus: ${API_CPUS:-2}
    mem_limit: ${API_MEMORY:-2g}
    memswap_limit: ${API_MEMORY:-2g}
    restart: unless-stopped
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ./deploy/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"]
    depends_on:
      api: {condition: service_healthy}
    cpus: 1
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped
volumes:
  pgdata:
