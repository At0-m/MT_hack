  /api/v1/exports:
    post:
      operationId: exportCalculation
      tags:
      - Export
      summary: Export the exact confirmed calculation as CSV
      description: Synchronous CSV, not a task. Complete validation and bounded buffering before 200. UTF-8 BOM,
        semicolon delimiter, decimal point, CRLF, RFC4180 quoting, null as empty cell. Exact columns in docs/CSV.md.
        Hash is returned in X-Calculation-ID; user export is NOT competition submission.
      responses:
        '200':
          description: Complete CSV attachment. No polling or follow-up GET.
          headers:
            X-Request-ID:
              description: Request correlation ID. Echo a valid incoming ID, or create one.
              schema:
                type: string
            Cache-Control:
              description: Per-operation caching policy.
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="tramflow-<safe-id>.csv"
            X-Calculation-ID:
              schema:
                $ref: '#/components/schemas/CalculationId'
          content:
