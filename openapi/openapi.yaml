      summary: Read immutable forecast snapshot metadata
      description: Cache-Control:private,no-cache. Read published snapshot metadata from the PostgreSQL registry.
        Keep previous snapshots and all required data/model versions at least the advertised retention after
        deactivation. Unfinished candidates are not public; cache misses do not mean the snapshot is absent.
      responses:
