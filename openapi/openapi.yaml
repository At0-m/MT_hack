  /api/v1/forecasts/query:
    post:
      operationId: queryForecast
      tags:
      - Forecast
      summary: Batch forecast route boardings and baseline intensity
      description: Pure read. One batch of hourly ONNX rows, cached by pinned dependencies, then optional day aggregation.
        DAY returns <=24 frames. No training, no persisted evaluation, no synchronous weather call. All requested
        routes must have full coverage. Cache-Control:no-store (bounded application cache allowed).
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Request correlation ID. Echo a valid incoming ID, or create one.
              schema:
                type: string
            Cache-Control:
              description: Per-operation caching policy.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'
