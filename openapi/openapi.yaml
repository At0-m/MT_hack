x-runtime-validation:
- Window ordering, alignment, coverage, lead-time and view width.
- No future observations or weather releases beyond forecast_origin_at.
- Requested identifiers belong to pinned snapshot/network.
- Product of weather/event/season factors in [0.25,4].
- Fleet delta requires known hourly baseline and resulting fleet in [0,200].
- Availability discriminators, missing data and divide-by-zero follow CALCULATIONS.md.
- Scenario effective_window is contained in query; no overrides outside it.
- CSV expected_calculation_id matches canonical calculation.
- Raw data, card hashes, submission labels are never public.
