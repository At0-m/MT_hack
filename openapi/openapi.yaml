openapi: 3.0.3
info:
  title: TramFlow implementation contract
  version: 1.0.0
  description: 'Team-agreed implementation baseline, not a claim of a deployed service. Model A predicts labels_day_*.boardings
    for route/date/hour. Scenario Engine is deterministic. UI views: day/week/month; no year. place_id is a depot;
    stop/segment predictions are unavailable. Physical fleet observed via successful validations is a proxy, not
    measured full service supply. All bundled examples and mock responses are SYNTHETIC. Normative companion docs:
    CALCULATIONS, BACKEND, FRONTEND, ML_DATA, CSV, WEATHER_MAP. Public and private ML boundaries are separated:
    no internal ML HTTP API is needed. PostgreSQL with PostGIS is the mandatory operational/runtime source of
    truth for versioned data, snapshot registry and the active snapshot pointer. ONNX, feature schemas,
    manifests and golden vectors remain immutable filesystem artifacts. Local memory is a bounded cache,
    not an authoritative registry. This storage revision preserves the public HTTP contract.'
servers:
- url: http://localhost:8080
  description: Local mock/development; production uses same-origin HTTPS.
- url: /
  description: Same-origin deployed service.
security:
- BasicAuth: []
tags:
- name: Operations
- name: Catalog
- name: Map
- name: Forecast
- name: Scenario
- name: Weather
- name: Quality
- name: Export
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags:
      - Operations
      summary: HTTP process liveness
      description: HTTP process liveness
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Request correlation ID. Echo a valid incoming ID, or create one.
              schema:
                type: string
            Cache-Control:
              description: Per-operation caching policy.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /health/ready:
    get:
      operationId: getReadiness
      tags:
      - Operations
      summary: PostgreSQL/PostGIS, published snapshot and ONNX readiness
      description: 200 when PostgreSQL/PostGIS and required migrations, a complete published snapshot, its prepared
        data and immutable model artifacts/ONNX session are usable. External weather and basemap services need
        not be available. 503 application/problem+json when not ready. No external probes per request; no
        fallback to a local file registry.
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Request correlation ID. Echo a valid incoming ID, or create one.
              schema:
                type: string
            Cache-Control:
              description: Per-operation caching policy.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
  /api/v1/bootstrap:
    get:
      operationId: getBootstrap
      tags:
      - Catalog
      summary: Get pinned snapshot, defaults and UI capabilities
      description: Cache-Control:no-store. Resolve the authoritative active snapshot and its metadata
        consistently from PostgreSQL. Use returned default_selection; never infer dataset dates or route IDs
        from examples. Active data are synthetic only in the original mock.
      responses:
        '200':
          description: Successful response.
          headers:
            X-Request-ID:
              description: Request correlation ID. Echo a valid incoming ID, or create one.
              schema:
                type: string
            Cache-Control:
              description: Per-operation caching policy.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '410':
          $ref: '#/components/responses/Error410'
        '422':
