      operationId: evaluateScenario
      tags:
      - Scenario
      summary: Evaluate formula-based fleet and manual-demand scenario
      description: Pure read. Reuses Model A boardings. Changing fleet or manual multipliers never retrains/reruns
        Model A when pinned baseline is cached. Formulas apply hourly within effective_window, then aggregate. No
        real dispatch operation. Negative resulting fleet or unknown baseline for a delta ->422.
      responses:
