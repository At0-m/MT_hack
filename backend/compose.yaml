services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: tramflow_publisher
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate .env with scripts/init-env.ps1}
      POSTGRES_DB: tramflow
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Generate .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init.sh:/docker-entrypoint-initdb.d/10-api-role.sh:ro
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tramflow_publisher -d tramflow"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 1g
  publisher:
    build:
      context: .
      target: runtime
    entrypoint: ["/app/publisher"]
    command: ["--migrate", "--bundle", "/data/demo-bundle.json", "--allow-synthetic"]
    environment:
      DATABASE_URL: postgres://tramflow_publisher:${DB_PASSWORD}@db:5432/tramflow?sslmode=disable
      API_PASSWORD: ${API_PASSWORD:?Generate .env}
    volumes:
      - ./artifacts:/data/artifacts:ro
      - ./testdata/demo-bundle.json:/data/demo-bundle.json:ro
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://tramflow_api:${API_DB_PASSWORD}@db:5432/tramflow?sslmode=disable
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: "false"
    volumes:
      - ./artifacts:/data/artifacts:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    cpus: 2
    mem_limit: 2g
    restart: unless-stopped
  tests:
    build:
      context: .
      target: integration
    environment:
      TEST_DATABASE_URL: postgres://tramflow_publisher:${DB_PASSWORD}@db:5432/tramflow?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]
volumes:
  pgdata:
