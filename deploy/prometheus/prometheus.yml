global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: tramflow
    metrics_path: /metrics
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9090
        refresh_interval: 5s
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
