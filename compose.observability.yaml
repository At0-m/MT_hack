services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=2d, --web.enable-remote-write-receiver]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9091:9090"]
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgres://tramflow_monitor:${MONITOR_DB_PASSWORD}@db:5432/tramflow?sslmode=disable
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run make init}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tramflow.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 384m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  prometheus_data:
  grafana_data:
